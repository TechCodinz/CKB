[package]
name = "ckb-cli"
version = "0.1.0"
edition = "2021"
description = "CKB CLI - Architectural intelligence for AI-era development"

[[bin]]
name = "ckb-cli"
path = "src/main.rs"

[[bin]]
name = "ckb-causality"
path = "src/bin/ckb-causality.rs"

[[bin]]
name = "ckb-memory-lane"
path = "src/bin/ckb-memory-lane.rs"

[dependencies]
ckb-core = { path = "../core", version = "0.1.0" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
comfy-table = "7.1"
chrono = "0.4"
md5 = "0.7"
uuid = { version = "1.0", features = ["v4"] }
