[package]
name = "ckb-mcp-server"
version = "0.1.0"
edition = "2021"
description = "CKB MCP Server - Model Context Protocol server for AI integration"
license = "MIT"
repository = "https://github.com/TechCodinz/CKB"
readme = "../README.md"

[[bin]]
name = "ckb-mcp-server"
path = "src/main.rs"

[dependencies]
ckb-core = { path = "../core", version = "0.1.0" }
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
