[package]
name = "ckb-mcp-server"
version = "0.1.0"
edition = "2021"
autobins = false
description = "CKB MCP Server - Model Context Protocol server for AI integration"
license = "MIT"
repository = "https://github.com/TechCodinz/CKB"
readme = "../README.md"

[[bin]]
name = "ckb-mcp-server"
path = "src/main.rs"

[[bin]]
name = "ckb-omnicode-validate"
path = "src/bin/omnicode_validate.rs"

[[bin]]
name = "reality_server_v5"
path = "src/bin/reality_server_v5.rs"

[[bin]]
name = "reality_gateway"
path = "src/bin/reality_gateway.rs"

[[bin]]
name = "render_gateway"
path = "src/bin/render_gateway.rs"

[[bin]]
name = "reality_bridge"
path = "src/bin/reality_bridge.rs"

[[bin]]
name = "model_registry_api"
path = "src/bin/model_registry_api.rs"

[[bin]]
name = "architecture_memory_mcp"
path = "src/bin/architecture_memory_mcp_v3.rs"

[[bin]]
name = "build_diagnostic_server"
path = "src/bin/build_diagnostic_server.rs"

[[bin]]
name = "deep_causality_mcp"
path = "src/bin/deep_causality_mcp.rs"

[[bin]]
name = "memory_lane_mcp"
path = "src/bin/memory_lane_mcp.rs"

[dependencies]
ckb-core = { path = "../core", version = "0.1.0" }
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
bincode = "1.3"
zip = "0.6"
base64 = "0.22"
