# Public repo deploy config — the CKB engine/Reality API server.
# The backend (billing, auth, dashboard API) has its own render.yaml in the
# private repo — see OPEN_SOURCE_STRATEGY.md for why these are split.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: cargo build --release -p ckb-mcp-server --bin reality_server_v2
    startCommand: ./target/release/reality_server_v2
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_API_KEY
        sync: false
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_BACKEND_URL
        sync: false
      - key: CKB_INTERNAL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
