# TEMPORARY compiler-diagnostic deployment. The served artifact contains only
# cargo check output for the public Reality v5 source; it is removed as soon as
# the exact compiler error is recovered and fixed.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: bash -lc 'cargo check -p ckb-mcp-server --bin reality_server_v5 > reality_v5_build.log 2>&1 || true; cargo build --release -p ckb-mcp-server --bin build_diagnostic_server'
    startCommand: ./target/release/build_diagnostic_server
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_BIND_ALL
        value: "1"
