# Public repo deploy config — production CKB Reality/architecture engine.
# The ChatGPT MCP edge is the public process. It exposes /mcp, OAuth resource
# discovery, keeps /health public, and forwards existing API traffic to the
# hardened Reality gateway. The Reality gateway still starts the tenant-isolated
# Reality v5 engine on localhost, bounds expensive scans, and preserves runtime traces.
#
# The local `ckb-intelligence` binary is also compiled as a release gate because
# VS Code/JetBrains use that facade for deep local activity + architecture memory.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: cargo build --locked --release -p ckb-mcp-server --bin ckb-mcp-server --bin reality_bridge --bin reality_server_v5 --bin reality_gateway --bin chatgpt_edge && cargo build --locked --release -p ckb-cli --bin ckb-intelligence
    startCommand: ./target/release/chatgpt_edge
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_ALLOW_LOCAL_SCAN
        value: "0"
      - key: CKB_MAX_CONCURRENT_SCANS
        value: "1"
      - key: CKB_MAX_RUNTIME_TRACES
        value: "100"
      - key: CKB_MAX_SPANS_PER_TRACE
        value: "1000"
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_REALITY_DATA_DIR
        value: "/opt/render/project/src/ckb_reality_data"
      # OAuth authorization server / CKB Cloud backend. The Rust resource
      # server calls its protected /oauth/introspect endpoint for each user token.
      - key: CKB_BACKEND_URL
        sync: false
      # Canonical RFC 9728 protected-resource identifier advertised to ChatGPT.
      - key: CKB_MCP_RESOURCE
        value: "https://ckb-mcp-server.onrender.com"
      # Must match INTERNAL_API_SECRET on the private ckb-backend-api service.
      # Used for OAuth token introspection and trusted internal calls.
      - key: CKB_INTERNAL_SECRET
        sync: false
      # Required production credential for the existing Reality gateway path.
      # This is server-side infrastructure/operator auth only. ChatGPT end users
      # never receive or present it; their authentication path is OAuth 2.1 + PKCE.
      - key: CKB_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
