# Public repo deploy config — production CKB Reality/architecture engine.
# The evidence-backed Reality bridge owns the current public Explorer contract.
# reality_server_v5 is compiled beside it as the per-project persistence candidate
# so Render acts as a real Rust build gate before any production promotion.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: cargo build --release -p ckb-mcp-server --bin ckb-mcp-server --bin reality_bridge --bin reality_server_v5
    startCommand: ./target/release/reality_bridge
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_ALLOW_LOCAL_SCAN
        value: "0"
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_REALITY_DATA_DIR
        value: "/opt/render/project/src/ckb_reality_data"
      - key: CKB_BACKEND_URL
        sync: false
      - key: CKB_INTERNAL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
