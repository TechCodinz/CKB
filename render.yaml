# Temporary Render validation topology before the shared-VPS migration.
# The outer render_gateway binds Render's public PORT immediately, then proxies
# into the hardened Reality gateway + v5 engine. This prevents Render port-scan
# timeouts while retaining the full advanced Reality stack.
services:
  - type: web
    name: ckb-mcp-server
    runtime: rust
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: cargo build --locked --release -p ckb-mcp-server --bin render_gateway --bin reality_gateway --bin reality_server_v5 --bin ckb-mcp-server && cargo build --locked --release -p ckb-cli --bin ckb-intelligence
    startCommand: ./target/release/render_gateway
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_ALLOW_LOCAL_SCAN
        value: "0"
      - key: CKB_MAX_CONCURRENT_SCANS
        value: "1"
      - key: CKB_MAX_RUNTIME_TRACES
        value: "100"
      - key: CKB_MAX_SPANS_PER_TRACE
        value: "1000"
      - key: CKB_ALLOWED_ORIGIN
        value: https://ckb-nu.vercel.app
      - key: CKB_REALITY_DATA_DIR
        value: /opt/render/project/src/ckb_reality_data
      - key: CKB_BACKEND_URL
        value: https://ckb-backend-api.onrender.com
      # RFC 9728 resource identifier for this MCP resource server, and the
      # audience the Cloud authorization server stamps into access tokens. Must
      # match CKB_MCP_RESOURCE on ckb-backend-api exactly, or every introspected
      # token is rejected.
      - key: CKB_MCP_RESOURCE
        value: https://ckb-mcp-server.onrender.com
      # Import the exact backend internal secret so the two services cannot
      # silently drift onto different credentials.
      - key: CKB_INTERNAL_SECRET
        fromService:
          type: web
          name: ckb-backend-api
          envVarKey: INTERNAL_API_SECRET
      # Optional operator/API-key path. The browser never receives it.
      - key: CKB_API_KEY
        sync: false
      # CKB -> OmniCode architecture-learning feedback. The sender writes a
      # retryable local outbox before delivery; OmniCode deduplicates on eventKey.
      - key: OMNICODE_FEEDBACK_URL
        value: https://omnicode-pro.vercel.app/api/integrations/learning-feedback
      - key: OMNICODE_CKB_FEEDBACK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Read-mostly API for the verified frontier-model registry. Public GET routes
  # expose provider/model capability truth; request adaptation remains protected
  # by CKB_API_KEY because request payloads may contain private prompt content.
  - type: web
    name: ckb-model-registry
    runtime: rust
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: cargo build --locked --release -p ckb-mcp-server --bin model_registry_api
    startCommand: ./target/release/model_registry_api
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_API_KEY
        sync: false
