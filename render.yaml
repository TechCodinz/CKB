# Public repo deploy config — production CKB Reality/architecture engine.
# Production remains on the proven bridge while Render compile-validates the
# authenticated gateway + tenant-isolated v5 engine as one deployable unit.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: cargo build --release -p ckb-mcp-server --bin ckb-mcp-server --bin reality_bridge --bin reality_server_v5 --bin reality_gateway
    startCommand: ./target/release/reality_bridge
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_ALLOW_LOCAL_SCAN
        value: "0"
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_REALITY_DATA_DIR
        value: "/opt/render/project/src/ckb_reality_data"
      - key: CKB_BACKEND_URL
        sync: false
      - key: CKB_INTERNAL_SECRET
        sync: false
      - key: CKB_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
