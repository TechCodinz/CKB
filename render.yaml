# TEMPORARY build-isolation deployment.
# The standard CKB server already proved shared ckb-core compiles on Render.
# This probe tests only the tiny diagnostic binary with no nested shell or
# Reality cargo-check command. It will be removed after the exact blocker is
# isolated; it does not change the Project Explorer UI.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    buildCommand: cargo build --release -p ckb-mcp-server --bin build_diagnostic_server
    startCommand: ./target/release/build_diagnostic_server
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_BIND_ALL
        value: "1"
