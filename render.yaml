# Public repo deploy config — the CKB engine/Reality API server.
# The backend (billing, auth, dashboard API) has its own render.yaml in the
# private repo — see OPEN_SOURCE_STRATEGY.md for why these are split.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    # Temporary production isolation: v3 uses the same CKB core/persistence
    # substrate with a smaller HTTP surface. If this build passes after the
    # DependencyGraph snapshot-clone fix, the remaining blocker is v4-specific.
    # If it fails, the defect is in shared core/build configuration and we keep
    # debugging there before adding more frontend capability.
    buildCommand: cargo build --release -p ckb-mcp-server --bin reality_server_v3
    startCommand: ./target/release/reality_server_v3
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_API_KEY
        sync: false
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_REALITY_DATA_DIR
        value: "/opt/render/project/src/ckb_reality_data"
      - key: CKB_BACKEND_URL
        sync: false
      - key: CKB_INTERNAL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
