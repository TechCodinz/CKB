# Public repo deploy config — the CKB engine/Reality API server.
# The backend (billing, auth, dashboard API) has its own render.yaml in the
# private repo — see OPEN_SOURCE_STRATEGY.md for why these are split.
services:
  - type: web
    name: ckb-mcp-server
    env: rust
    plan: free
    # Build the deployed Reality server and the stdio Architecture Memory MCP
    # together. Render therefore becomes a production compile gate for the two
    # core binaries even while GitHub Actions is unavailable.
    buildCommand: cargo build --release -p ckb-mcp-server --bin reality_server_v4 --bin architecture_memory_mcp
    startCommand: ./target/release/reality_server_v4
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CKB_API_KEY
        sync: false
      - key: CKB_ALLOWED_ORIGIN
        sync: false
      - key: CKB_BIND_ALL
        value: "1"
      - key: CKB_REALITY_DATA_DIR
        value: "/opt/render/project/src/ckb_reality_data"
      - key: CKB_BACKEND_URL
        sync: false
      - key: CKB_INTERNAL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
