name: Refresh VS Code release dependencies

on:
  push:
    branches: [agent/ckb-launch-hardening]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ckb-launch-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - name: Refresh VS Code packaging toolchain
        working-directory: integrations/vscode
        run: |
          npm install --save-dev @vscode/vsce@3.9.2
          npm audit fix
      - name: Compile extension
        working-directory: integrations/vscode
        run: npm run compile
      - name: Package clean VSIX
        working-directory: integrations/vscode
        run: npx @vscode/vsce package --out /tmp/ckb-vscode.vsix
      - name: Block unresolved high or critical npm advisories
        working-directory: integrations/vscode
        run: npm audit --audit-level=high
      - name: Commit refreshed manifest and lockfile
        run: |
          if git diff --quiet -- integrations/vscode/package.json integrations/vscode/package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/vscode/package.json integrations/vscode/package-lock.json
          git commit -m 'chore(vscode): refresh packaging dependencies [deps-lock]'
          git push origin HEAD:agent/ckb-launch-hardening
