name: Publish VS Code Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'integrations/vscode/**'
      - '.github/workflows/publish-vscode.yml'
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean
      force_publish:
        description: 'Publish the current package version even when the version did not change'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: vscode-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-vscode:
    name: Package and publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect publishable version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./integrations/vscode/package.json').version")"
          SHOULD_PUBLISH=false
          REASON="version unchanged"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_publish }}" == "true" ]]; then
            SHOULD_PUBLISH=true
            REASON="manual forced publish"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SHOULD_PUBLISH=true
            REASON="version tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_PUBLISH=true
            REASON="manual publish"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            OLD_VERSION=""
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
              OLD_VERSION="$(git show "$BEFORE:integrations/vscode/package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)"
            fi
            if [[ "$OLD_VERSION" != "$VERSION" ]]; then
              SHOULD_PUBLISH=true
              REASON="package version changed ${OLD_VERSION:-none} -> $VERSION"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "CKB VS Code $VERSION: $REASON (publish=$SHOULD_PUBLISH)"

      - name: Set up Node 22
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        working-directory: integrations/vscode
        run: npm ci

      - name: Compile extension
        if: steps.release.outputs.should_publish == 'true'
        working-directory: integrations/vscode
        run: npm run compile

      - name: Package VSIX
        if: steps.release.outputs.should_publish == 'true'
        working-directory: integrations/vscode
        run: npx --yes @vscode/vsce@latest package --out ckb-vscode-${{ steps.release.outputs.version }}.vsix

      - name: Upload VSIX artifact
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ckb-vscode-${{ steps.release.outputs.version }}
          path: integrations/vscode/ckb-vscode-${{ steps.release.outputs.version }}.vsix
          retention-days: 90

      - name: Publish to VS Code Marketplace
        if: steps.release.outputs.should_publish == 'true'
        working-directory: integrations/vscode
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN || '' }}
          PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pre_release || false }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRE_RELEASE" == "true" ]]; then FLAGS+=(--pre-release); fi

          if [[ -n "$VSCE_TOKEN" ]]; then
            echo "Publishing CKB ${{ steps.release.outputs.version }} with Marketplace PAT authentication."
            npx --yes @vscode/vsce@latest publish "${FLAGS[@]}" --pat "$VSCE_TOKEN"
          else
            echo "VSCE_TOKEN is not configured; attempting VS Code Marketplace trusted publishing (OIDC)."
            echo "Using the current vsce pre-release because OIDC trusted publishing was introduced after the latest stable npm release."
            echo "The Marketplace publisher must trust this exact GitHub repository/workflow before OIDC can succeed."
            npx --yes @vscode/vsce@next publish "${FLAGS[@]}" --oidc
          fi

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "### CKB VS Code Marketplace" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.release.outputs.version || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish gate: ${{ steps.release.outputs.should_publish || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.release.outputs.reason || 'workflow stopped before release detection' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach VSIX to GitHub Release
        if: steps.release.outputs.should_publish == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: integrations/vscode/ckb-vscode-${{ steps.release.outputs.version }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
