name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Publish as pre-release'
        required: false
        default: 'false'

jobs:
  publish-vscode:
    name: Package and publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Install dependencies
        working-directory: integrations/vscode
        run: npm ci

      - name: Compile extension
        working-directory: integrations/vscode
        run: npm run compile

      - name: Package VSIX
        working-directory: integrations/vscode
        run: npx vsce package --out ckb-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ckb-vscode-${{ github.ref_name }}
          path: integrations/vscode/ckb-vscode.vsix
          retention-days: 90

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_TOKEN != '' }}
        working-directory: integrations/vscode
        # VSCE_TOKEN must be set as a repository secret.
        # Get it from https://dev.azure.com → Personal Access Tokens
        # with scope: Marketplace → Manage
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.pre-release }}" = "true" ]; then
            npx vsce publish --pre-release --pat "$VSCE_TOKEN"
          else
            npx vsce publish --pat "$VSCE_TOKEN"
          fi

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: integrations/vscode/ckb-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
