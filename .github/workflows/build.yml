name: Build & Test

# Runs on every push and PR to main. Covers the open-source components only
# (core, cli, mcp-server, WASM bindings, VS Code extension, SDKs).
# The backend (auth/billing) and web dashboard are in the private
# TechCodinz/ckb-cloud repo and have their own CI there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (core, cli, mcp-server)
        # Scoped to these three packages deliberately — bindings/wasm is a
        # workspace member but only builds for the wasm32 target (its
        # wasm-bindgen externs don't resolve on a native target), so a plain
        # `cargo build --workspace` here would fail on that crate.
        run: cargo build --locked --release -p ckb-core -p ckb-cli -p ckb-mcp-server

      - name: Run tests
        run: cargo test --locked --release -p ckb-core -p ckb-cli -p ckb-mcp-server

      - name: Clippy
        run: cargo clippy --locked -p ckb-core -p ckb-cli -p ckb-mcp-server --all-targets -- -D warnings
        continue-on-error: true # informational — not a merge blocker until codebase is clippy-clean

  wasm:
    runs-on: ubuntu-latest
    # Marked continue-on-error: the WASM binding uses web-sys/wasm-bindgen-futures
    # whose exact API has shifted across versions — see BUILD_INSTRUCTIONS.md §1a.
    # Treated as informational until verified against a pinned web-sys version.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@v2

      - name: Build WASM bindings
        run: cargo build --locked --release -p ckb-wasm --target wasm32-unknown-unknown

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Install dependencies
        working-directory: integrations/vscode
        run: npm ci

      - name: Compile
        working-directory: integrations/vscode
        run: npm run compile

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node SDK syntax check
        run: node --check bindings/node/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python SDK syntax check
        run: python3 -m py_compile bindings/python/ckb/core.py bindings/python/ckb/__init__.py bindings/python/setup.py
