name: CKB Architecture Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ckb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CKB Architecture Check
        uses: ./.github/actions/ckb-scan
        with:
          path: '.'
          fail-on: 'error'
          strict: 'true'
