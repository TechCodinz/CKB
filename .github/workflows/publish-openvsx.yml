name: Publish Open VSX Extension

on:
  push:
    branches: [main]
    paths:
      - 'integrations/vscode/**'
      - '.github/workflows/publish-openvsx.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: open-vsx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-openvsx:
    name: Package and publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Install dependencies
        working-directory: integrations/vscode
        run: npm ci

      - name: Audit release toolchain
        working-directory: integrations/vscode
        run: npm audit --audit-level=high

      - name: Compile extension
        working-directory: integrations/vscode
        run: npm run compile

      - name: Read extension version
        id: release
        working-directory: integrations/vscode
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check Open VSX registry version
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            'https://open-vsx.org/api/TechCodinz/ckb-vscode' -o /tmp/openvsx.json
          CURRENT_VERSION="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/openvsx.json','utf8')); process.stdout.write(String(j.version || '')); ")"
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "::error::Open VSX registry response did not include a version."
            exit 1
          fi
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Open VSX already has CKB v$RELEASE_VERSION; skipping duplicate publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Open VSX currently reports v$CURRENT_VERSION; CKB v$RELEASE_VERSION will be published."
          fi

      - name: Package VSIX
        working-directory: integrations/vscode
        run: npx @vscode/vsce package --out ckb-vscode-${{ steps.release.outputs.version }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ckb-openvsx-${{ steps.release.outputs.version }}
          path: integrations/vscode/ckb-vscode-${{ steps.release.outputs.version }}.vsix
          retention-days: 90

      - name: Publish to Open VSX
        if: steps.registry.outputs.should_publish == 'true'
        working-directory: integrations/vscode
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN || secrets.OPENVSX_TOKEN || secrets.OPENVSX_NAMESPACE_TOKEN || secrets.OVSX_TOKEN || secrets.OVSX_PAT || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPEN_VSX_TOKEN" ]]; then
            echo "::error::Open VSX publishing credential is missing. Configure OPEN_VSX_TOKEN (legacy OPENVSX_TOKEN / OPENVSX_NAMESPACE_TOKEN / OVSX_TOKEN / OVSX_PAT also supported) in repository Actions secrets."
            exit 1
          fi
          npx --yes ovsx publish "ckb-vscode-${{ steps.release.outputs.version }}.vsix" -p "$OPEN_VSX_TOKEN"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "### CKB Open VSX" >> "$GITHUB_STEP_SUMMARY"
          echo "- Namespace: TechCodinz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Extension: ckb-vscode" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.release.outputs.version || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry version before publish: ${{ steps.registry.outputs.current_version || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish required: ${{ steps.registry.outputs.should_publish || 'not evaluated' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: https://open-vsx.org/extension/TechCodinz/ckb-vscode" >> "$GITHUB_STEP_SUMMARY"
