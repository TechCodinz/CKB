import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'dev.ckb'
version = '1.9.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'

    intellijPlatform {
        // Build the modern line against the oldest IDE it advertises.
        // Marketplace 1.8.0 continues serving 2023.3-2024.3 users.
        intellijIdeaCommunity '2024.3.6'
        bundledPlugin 'com.intellij.java'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_21)
    }
}

intellijPlatform {
    pluginConfiguration {
        version = project.version
        ideaVersion {
            // JetBrains recommends no until-build for the 2024.3+ compatibility model.
            // Publication is guarded by Plugin Verifier against the current stable IDE.
            sinceBuild = '243'
        }
    }

    pluginVerification {
        ides {
            // Verify the minimum platform and the current stable 2026.2 line.
            current()
            create IntelliJPlatformType.IntellijIdea, '2026.2.0.1'
        }
    }
}

signPlugin {
    certificateChain = providers.environmentVariable('CERTIFICATE_CHAIN')
    privateKey = providers.environmentVariable('PRIVATE_KEY')
    password = providers.environmentVariable('PRIVATE_KEY_PASSWORD')
}

publishPlugin {
    token = providers.environmentVariable('PUBLISH_TOKEN')
}

test {
    useJUnitPlatform()
}
