[package]
name = "ckb-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# Parsing
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-java = "0.23"

# Concurrency
rayon = "1.8"
dashmap = "5.5"
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Storage
rocksdb = "0.21"
redis = { version = "0.24", optional = true }

# Graph algorithms
petgraph = "0.6"
pathfinding = "4.4"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
glob = "0.3"
ignore = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
num_cpus = "1.16"
lru = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "parser"
path = "benches/parser.rs"
harness = false
